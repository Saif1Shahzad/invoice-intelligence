[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-intelligence"
version = "1.1.0"
description = "Invoice intelligence with evidence and human confirmation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "pdfplumber>=0.11,<1",
  "pypdf>=5,<7", "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_intelligence = ["web/*.html", "web/*.css", "web/*.js", "web/*.json"]
